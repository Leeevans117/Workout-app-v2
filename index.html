    <script>
      (function () {
        // 1. One-time cleanup: unregister any existing service workers and delete their caches.
        // Never register a new service worker.
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
              if (registrations && registrations.length > 0) {
                Promise.all(
                  registrations.map(function (reg) {
                    return reg.unregister();
                  })
                ).then(function () {
                  if ('caches' in window) {
                    caches.keys().then(function (names) {
                      for (var i = 0; i < names.length; i++) {
                        caches.delete(names[i]);
                      }
                    });
                  }
                });
              }
            }).catch(function () {});
          }
        } catch (e) {}

        // 2. If a JS or CSS chunk fails to load, reload the page once (guarded with sessionStorage).
        // Do not delete caches or localStorage when this happens.
        function handleChunkLoadError(event) {
          var target = event && (event.target || event.srcElement);
          var isScriptOrLink =
            target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK');
          var msg =
            (event && event.message) ||
            (event && event.reason && event.reason.message) ||
            '';
          var isChunkError =
            isScriptOrLink ||
            /Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk .* failed|Unable to preload CSS/i.test(
              String(msg)
            );

          if (isChunkError) {
            try {
              var reloadedForPath = sessionStorage.getItem('apex_chunk_reload_once');
              var currentPath = window.location.pathname + window.location.search;
              if (reloadedForPath !== currentPath) {
                sessionStorage.setItem('apex_chunk_reload_once', currentPath);
                window.location.reload();
              }
            } catch (e) {}
          }
        }
        window.addEventListener('error', handleChunkLoadError, true);
        window.addEventListener('unhandledrejection', handleChunkLoadError);
      })();
    </script>

  <body class="bg-[#0B0E14] text-slate-100 antialiased selection:bg-blue-600 selection:text-white overflow-x-hidden min-h-screen">

    </div>
