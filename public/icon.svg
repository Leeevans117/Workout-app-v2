<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0F1422"/>
      <stop offset="100%" stopColor="#07090E"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#3B82F6"/>
      <stop offset="50%" stopColor="#8B5CF6"/>
      <stop offset="100%" stopColor="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Glowing Emblem -->
  <g filter="url(#glow)">
    <!-- Shield / Spine Hygiene Peak -->
    <path d="M 256 80 L 390 145 C 390 280 290 380 256 420 C 222 380 122 280 122 145 Z" fill="none" stroke="url(#pulseGrad)" stroke-width="24" stroke-linejoin="round"/>
    
    <!-- Central Pulse Wave -->
    <path d="M 160 256 L 210 256 L 235 190 L 275 320 L 305 256 L 352 256" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lumbar Core Center Dot -->
    <circle cx="256" cy="256" r="14" fill="#38BDF8"/>
  </g>
</svg>
